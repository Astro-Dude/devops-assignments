# Production overrides. Only the differences from values.yaml need to appear.
replicaCount: 3

config:
  environment: production
  logLevel: warn
  welcomeMessage: "Notes App - PRODUCTION"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
