apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tickethub-backend
  namespace: tickethub-raw
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tickethub-backend}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 85}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
