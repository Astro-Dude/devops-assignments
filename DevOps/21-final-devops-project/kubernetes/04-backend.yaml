apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickethub-backend
  namespace: tickethub-raw
  labels: {app.kubernetes.io/name: tickethub-backend, app.kubernetes.io/part-of: tickethub}
spec:
  # no `replicas:` — the HPA in 07-hpa.yaml owns the replica count
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: tickethub-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tickethub-backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: ghcr.io/astro-dude/s21-tickethub-backend:c9ba4c7618f8b5d827d3f57722fac8103cd804e4
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - configMapRef: {name: tickethub-config}
            - secretRef: {name: tickethub-db}
          securityContext: &csc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: &res
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      containers:
        - name: backend
          image: ghcr.io/astro-dude/s21-tickethub-backend:c9ba4c7618f8b5d827d3f57722fac8103cd804e4
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: tickethub-config}
            - secretRef: {name: tickethub-db}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: {seconds: 5}   # drain: let ingress-nginx drop this endpoint first
          securityContext: *csc
          resources: *res
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tickethub-backend
  namespace: tickethub-raw
  labels: {app.kubernetes.io/name: tickethub-backend}
spec:
  selector: {app.kubernetes.io/name: tickethub-backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
