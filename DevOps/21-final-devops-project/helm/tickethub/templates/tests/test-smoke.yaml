apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tickethub.fullname" . }}-smoke-test
  labels: {{- include "tickethub.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          set -e
          wget -qO- http://{{ include "tickethub.fullname" . }}-backend:{{ .Values.backend.port }}/ready
          wget -qO- http://{{ include "tickethub.fullname" . }}-backend:{{ .Values.backend.port }}/api/stats
          wget -qO- http://{{ include "tickethub.fullname" . }}-frontend/nginx-health
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 100m, memory: 32Mi}
