{{- $fullname := include "tickethub.fullname" . -}}
{{- $sel := dict "component" "tickethub-backend" "root" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "tickethub.labels" . | nindent 4 }}
    {{- include "tickethub.selector" $sel | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "tickethub.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tickethub.selector" $sel | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # roll the pods when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "tickethub.podSecurity" . | nindent 6 }}
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: {{ include "tickethub.backendImage" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - configMapRef: {name: {{ $fullname }}-config}
            - secretRef: {name: {{ include "tickethub.secretName" . }}}
          {{- include "tickethub.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
      containers:
        - name: backend
          image: {{ include "tickethub.backendImage" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.backend.port }}}
          envFrom:
            - configMapRef: {name: {{ $fullname }}-config}
            - secretRef: {name: {{ include "tickethub.secretName" . }}}
          # startup: give the app up to 60s to boot before liveness starts counting
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness: only receive traffic while the database is reachable
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          {{- include "tickethub.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "tickethub.labels" . | nindent 4 }}
    {{- include "tickethub.selector" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "tickethub.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
