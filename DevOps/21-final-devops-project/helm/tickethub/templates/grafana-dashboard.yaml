{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar of kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tickethub.fullname" . }}-dashboard
  labels:
    {{- include "tickethub.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  tickethub.json: |-
    {{- .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
{{- end }}
