{{- if and .Values.monitoring.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tickethub.fullname" . }}-alerts
  labels:
    {{- include "tickethub.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  groups:
    {{- (.Files.Get "files/alert-rules.yaml" | replace "__NS__" .Release.Namespace | replace "__URGENT__" (toString .Values.monitoring.prometheusRule.urgentBacklogThreshold)) | nindent 4 }}
{{- end }}
