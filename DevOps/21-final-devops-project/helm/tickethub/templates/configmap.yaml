apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tickethub.fullname" . }}-config
  labels: {{- include "tickethub.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DEFAULT_TEAM: {{ .Values.config.defaultTeam | quote }}
  DB_HOST: {{ include "tickethub.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
