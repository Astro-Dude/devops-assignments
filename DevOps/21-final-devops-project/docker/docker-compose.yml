# Full local stack:  docker compose -f docker/docker-compose.yml up --build
# UI  -> http://localhost:3000      API -> http://localhost:8000/docs  (override with FRONTEND_PORT / BACKEND_PORT)
name: tickethub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickethub
      POSTGRES_USER: tickethub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickethub -d tickethub"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ../application/backend
      dockerfile: ../../docker/backend.Dockerfile
      args:
        APP_VERSION: compose-local
    environment:
      APP_ENV: compose
      DB_HOST: postgres
      DB_NAME: tickethub
      DB_USER: tickethub
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    command: ["sh", "-c", "python -m app.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ../application/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"

volumes:
  pgdata:
