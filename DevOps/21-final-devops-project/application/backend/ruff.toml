line-length = 110
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI's Depends() in default args is the documented pattern

[lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works
"alembic/*" = ["I"]

[lint.isort]
known-third-party = ["alembic"]
