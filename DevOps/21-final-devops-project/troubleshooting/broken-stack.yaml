# Final Troubleshooting Challenge — TicketHub with SEVEN deliberately planted faults.
# DO NOT use this as a reference deployment; the working version is fixed-stack.yaml.
#   kubectl create namespace tickethub-broken
#   kubectl -n tickethub-broken create secret generic tickethub-db \
#     --from-literal=DB_USER=tickethub --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
#   kubectl apply -f troubleshooting/broken-stack.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: tickethub-config
  namespace: tickethub-broken
data:
  APP_ENV: troubleshooting
  LOG_LEVEL: INFO
  DB_PORT: "5432"
  DB_NAME: tickethub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tickethub-postgres-data
  namespace: tickethub-broken
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickethub-postgres
  namespace: tickethub-broken
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: tickethub-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tickethub-postgres}
    spec:
      securityContext: {runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, fsGroup: 70}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: tickethub}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: tickethub-db, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tickethub-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tickethub-postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: tickethub-postgres
  namespace: tickethub-broken
spec:
  selector: {app.kubernetes.io/name: tickethub-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickethub-backend
  namespace: tickethub-broken
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: tickethub-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tickethub-backend}
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/astro-dude/s21-tickethub-backend:latest
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - configMapRef: {name: tickethub-config}
            - secretRef: {name: tickethub-db}
      containers:
        - name: backend
          image: ghcr.io/astro-dude/s21-tickethub-backend:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: tickethub-config}
            - secretRef: {name: tickethub-db}
          livenessProbe:
            httpGet: {path: /health, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tickethub-backend
  namespace: tickethub-broken
spec:
  selector: {app.kubernetes.io/name: tickethub-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickethub-frontend
  namespace: tickethub-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tickethub-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tickethub-frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/astro-dude/s21-tickethub-frontend:0b9665e38a2db926e487fe72e9283d84e672c0d5
          ports: [{containerPort: 8080}]
          env:
            - {name: BACKEND_URL, value: "http://tickethub-backend:8000"}
          readinessProbe:
            httpGet: {path: /nginx-health, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tickethub-frontend
  namespace: tickethub-broken
spec:
  selector: {app.kubernetes.io/name: tickethub-frontend}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickethub
  namespace: tickethub-broken
spec:
  ingressClassName: nginx
  rules:
    - host: broken.tickethub.localtest.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: tickethub-backend, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: tickethub-frontend, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tickethub-backend
  namespace: tickethub-broken
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tickethub-backend}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
