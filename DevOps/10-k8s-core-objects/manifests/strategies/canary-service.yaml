apiVersion: v1
kind: Service
metadata:
  name: app-canary-svc
spec:
  type: NodePort
  # Deliberately selects app=myapp ONLY - it ignores the track label, so it
  # matches BOTH the stable and the canary pods. Traffic share is therefore
  # decided purely by the ratio of replica counts.
  selector:
    app: myapp
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
