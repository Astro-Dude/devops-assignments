apiVersion: v1
kind: Service
metadata:
  name: app-rolling-svc
spec:
  type: NodePort
  selector:
    app: app-rolling
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: app-recreate-svc
spec:
  type: NodePort
  selector:
    app: app-recreate
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
