# Same Service name "api" in two namespaces, each answering with its namespace,
# plus a headless Service + StatefulSet for per-pod names, and a client pod.
# Apply with:  NS=s11-dns-a envsubst < dns-lab.yaml | kubectl apply -f -   (and again for s11-dns-b)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ${NS}
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo \"api answering from namespace ${NS}\" > /www/index.html && httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ${NS}
spec:
  selector: { app: api }
  ports:
    - name: http          # named port -> SRV record _http._tcp.api.<ns>.svc.cluster.local
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: ${NS}
spec:
  clusterIP: None
  selector: { app: web-sts }
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: ${NS}
spec:
  serviceName: web-headless
  replicas: 2
  selector:
    matchLabels: { app: web-sts }
  template:
    metadata:
      labels: { app: web-sts }
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
