# ReplicaSet keeps N Pods alive; the Service gives them one stable name/IP.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: backend-rs
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector: { app: backend }
  ports:
    - port: 80
      targetPort: 80
