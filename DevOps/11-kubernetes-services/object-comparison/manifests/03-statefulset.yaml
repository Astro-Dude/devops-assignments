# StatefulSet -> ordinal names, one PVC per Pod, stable DNS through a headless Service
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None          # headless: DNS returns the Pod IPs, one name per Pod
  selector: { app: db }
  ports:
    - name: tcp
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 2
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "[ -f /data/id ] || echo \"created by $(hostname) at $(date +%T)\" > /data/id; sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 5m, memory: 8Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 64Mi }
