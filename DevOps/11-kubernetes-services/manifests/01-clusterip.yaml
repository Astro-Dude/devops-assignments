apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
spec:
  type: ClusterIP          # this is the default; stated here for clarity
  selector:
    app: web
  ports:
    - name: http
      port: 8080           # the port the SERVICE listens on
      targetPort: 80       # the port the POD listens on (containerPort)
