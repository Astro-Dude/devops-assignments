# FIXED: default dnsPolicy (ClusterFirst) -> kubelet writes nameserver 10.96.0.10 (kube-dns / CoreDNS).
apiVersion: v1
kind: Pod
metadata:
  name: dns-broken
  namespace: s11-dns-a
spec:
  dnsPolicy: ClusterFirst
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
