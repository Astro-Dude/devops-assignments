# BROKEN: the pod ignores cluster DNS and points at a nameserver that does not exist.
apiVersion: v1
kind: Pod
metadata:
  name: dns-broken
  namespace: s11-dns-a
spec:
  dnsPolicy: "None"
  dnsConfig:
    nameservers: ["10.96.0.99"]        # nothing listens here
    searches: ["s11-dns-a.svc.cluster.local", "svc.cluster.local", "cluster.local"]
    options:
      - { name: ndots, value: "5" }
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
