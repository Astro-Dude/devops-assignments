# emptyDir: created empty when the pod is scheduled, deleted when the pod dies.
# Shared between containers in the same pod. Survives a CONTAINER restart,
# does NOT survive a POD deletion.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"line $i\" >> /shared/log.txt; sleep 3; done"]
      volumeMounts:
        - name: scratch
          mountPath: /shared
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 30; done"]
      volumeMounts:
        - name: scratch
          mountPath: /shared
  volumes:
    - name: scratch
      emptyDir: {}
