apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50     # scale to keep average CPU at 50% of the request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0   # react immediately
    scaleDown:
      stabilizationWindowSeconds: 60  # default is 300s; shortened so the demo finishes
