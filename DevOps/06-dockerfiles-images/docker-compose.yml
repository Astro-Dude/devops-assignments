# Task 3: deploy multiple application types with a single command.
#
#   docker compose up -d      start everything
#   docker compose ps         see what is running
#   docker compose down       stop and remove everything
#
# Each service is a different language/runtime, all built from the
# Dockerfiles in ../05-docker-fundamentals/.
services:

  nodejs:
    build: ../05-docker-fundamentals/nodejs-app
    image: hello-nodejs:1.0
    container_name: compose-nodejs
    ports:
      - "9091:3000"
    restart: unless-stopped

  python:
    build: ../05-docker-fundamentals/python-app
    image: hello-python:1.0
    container_name: compose-python
    ports:
      - "9092:5000"
    restart: unless-stopped

  java:
    build: ../05-docker-fundamentals/java-app
    image: hello-java:1.0
    container_name: compose-java
    ports:
      - "9093:8080"
    restart: unless-stopped
