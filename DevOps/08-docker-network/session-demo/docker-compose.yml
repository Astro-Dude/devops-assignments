services:

  frontend:
    image: nginx:latest
    ports:
      # Course demo used 8080:80. Host port changed to 9098 because 8080 is
      # used by another lab on this machine.
      - "9098:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend_net
    # Added: nginx resolves "backend" when it starts, so it must start after
    # the backend container exists. Without this the frontend exited with
    # 'host not found in upstream "backend"' on the first `up`.
    depends_on:
      - backend

  backend:
    build: ./backend
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - database

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

networks:
  frontend_net:
  backend_net:

volumes:
  db_data: