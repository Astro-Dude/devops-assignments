# Load generator for the course HPA demo (manifests/hpa-course/).
# Same loop as the course's `kubectl run load-generator ...` command, wrapped in a
# Deployment so the load can be INCREASED by scaling it:
#   kubectl scale deploy/load-generator --replicas=4
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
