apiVersion: apps/v1
kind: Deployment
metadata:
  name: s16-calculator
  labels:
    app: s16-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s16-calculator
  template:
    metadata:
      labels:
        app: s16-calculator
    spec:
      imagePullSecrets:
        - name: ghcr-pull          # created in the deploy job from GITHUB_TOKEN
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER # replaced by the deploy job with ghcr.io/...:<sha>
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
