# Three tiny apps so the routing rules have something distinguishable to hit.
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, labels: { app: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          command: ["/bin/sh","-c","echo '<h1>FRONTEND</h1>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend-svc }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, labels: { app: backend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          command: ["/bin/sh","-c","echo '<h1>BACKEND API</h1>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: backend-svc }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: admin, labels: { app: admin } }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin } }
  template:
    metadata: { labels: { app: admin } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          command: ["/bin/sh","-c","echo '<h1>ADMIN PANEL</h1>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: admin-svc }
spec:
  selector: { app: admin }
  ports: [{ port: 80, targetPort: 80 }]
