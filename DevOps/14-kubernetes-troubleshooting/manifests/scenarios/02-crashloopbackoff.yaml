apiVersion: apps/v1
kind: Deployment
metadata: { name: broken-crash }
spec:
  replicas: 1
  selector: { matchLabels: { app: broken-crash } }
  template:
    metadata: { labels: { app: broken-crash } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # FAULT: the app exits because a required env var is missing
          command:
            - sh
            - -c
            - |
              echo "starting checkout-service..."
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set" >&2
                exit 1
              fi
              while true; do sleep 30; done
