# BROKEN: the APPLICATION's secret. The developer encoded the password with
#   echo "mypassword" | base64      -> bXlwYXNzd29yZAo=
# echo without -n appends a newline, so the decoded value is "mypassword\n" (11 bytes).
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: s12-trouble
type: Opaque
data:
  DB_USER: eWF0cmlfYWRtaW4=
  DB_PASSWORD: bXlwYXNzd29yZAo=
