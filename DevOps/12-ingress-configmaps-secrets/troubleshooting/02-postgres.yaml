apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: s12-trouble
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: yatri
          envFrom:
            - secretRef:
                name: postgres-db-secret
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "yatri_admin", "-d", "yatri"]
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: s12-trouble
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
