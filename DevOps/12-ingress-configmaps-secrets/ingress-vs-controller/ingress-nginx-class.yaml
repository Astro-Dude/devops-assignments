# The same Ingress, claimed by the ingress-nginx controller (IngressClass "nginx").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: s12-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: demo.s12.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port: { number: 80 }
