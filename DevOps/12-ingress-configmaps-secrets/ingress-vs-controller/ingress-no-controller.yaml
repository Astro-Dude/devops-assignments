# An Ingress that NO controller claims: the class does not exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: s12-ingress
spec:
  ingressClassName: no-such-class
  rules:
    - host: demo.s12.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port: { number: 80 }
