apiVersion: v1
kind: Namespace
metadata:
  name: s12-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: s12-ingress
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: hello
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo 'hello from the s12-ingress demo app' > /www/index.html && httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: s12-ingress
spec:
  selector: { app: hello }
  ports:
    - port: 80
      targetPort: 8080
