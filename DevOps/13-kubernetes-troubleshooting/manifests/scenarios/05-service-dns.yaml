apiVersion: apps/v1
kind: Deployment
metadata: { name: payments }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          command: ["/bin/sh","-c","echo 'payments ok' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: payments-svc }
spec:
  selector:
    app: payment           # FAULT: pods are labelled "payments", not "payment"
  ports:
    - port: 80
      targetPort: 80
