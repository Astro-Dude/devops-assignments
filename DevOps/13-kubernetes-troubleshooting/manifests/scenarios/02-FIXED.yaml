apiVersion: apps/v1
kind: Deployment
metadata: { name: broken-crash }
spec:
  replicas: 1
  selector: { matchLabels: { app: broken-crash } }
  template:
    metadata: { labels: { app: broken-crash } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          env:
            - name: DATABASE_URL          # FIX: supply the missing variable
              value: "postgres://db:5432/checkout"
          command:
            - sh
            - -c
            - |
              echo "starting checkout-service..."
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set" >&2
                exit 1
              fi
              echo "connected to $DATABASE_URL"
              while true; do sleep 30; done
