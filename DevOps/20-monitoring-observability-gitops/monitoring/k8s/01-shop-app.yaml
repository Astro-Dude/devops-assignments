# Demo workload: shop-web (public API) -> shop-inventory (backend). Same image, different ROLE.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: demo
  labels: {app: shop-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop-web}
  template:
    metadata:
      labels: {app: shop-web}
    spec:
      containers:
        - name: app
          image: shop-demo:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: web}
            - {name: INVENTORY_URL, value: "http://shop-inventory:8000"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger.tracing.svc.cluster.local:4318"}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: demo
  labels: {app: shop-web}
spec:
  type: NodePort
  selector: {app: shop-web}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 31080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-inventory
  namespace: demo
  labels: {app: shop-inventory}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-inventory}
  template:
    metadata:
      labels: {app: shop-inventory}
    spec:
      containers:
        - name: app
          image: shop-demo:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: inventory}
            - {name: ERROR_RATE, value: "0.05"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger.tracing.svc.cluster.local:4318"}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shop-inventory
  namespace: demo
  labels: {app: shop-inventory}
spec:
  selector: {app: shop-inventory}
  ports:
    - {name: http, port: 8000, targetPort: http}
