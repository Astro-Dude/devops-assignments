# Steady background traffic (orders + index) so the dashboards have something to show.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
  labels: {app: loadgen}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://shop-web.demo:8000/order
                curl -s -o /dev/null http://shop-web.demo:8000/
                sleep 0.3
              done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
# CPU burner: scaled to 0 by default; scale to 1 to push shop-web over its CPU limit
# and make the ShopHighCPU alert fire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: demo
  labels: {app: cpu-burner}
spec:
  replicas: 0
  selector:
    matchLabels: {app: cpu-burner}
  template:
    metadata:
      labels: {app: cpu-burner}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in 1 2 3 4 5 6; do
                ( while true; do curl -s -o /dev/null "http://shop-web.demo:8000/work?ms=400"; done ) &
              done
              wait
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 200m, memory: 32Mi}
