# Applied once by hand (kubectl apply). It lives OUTSIDE the synced path on purpose:
# it tells Argo CD where the desired state is; it is not part of that desired state.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Astro-Dude/devops-assignments.git
    targetRevision: main
    path: DevOps/20-monitoring-observability-gitops/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true      # delete cluster objects whose manifests were removed from Git
      selfHeal: true   # revert manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
