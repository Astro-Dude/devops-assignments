# Session 21 capstone — TicketHub CI/CD + DevSecOps pipeline.
# Canonical copy: .github/workflows/s21-final-devops-project.yml (GitHub only runs root workflows).
# Mirror:         DevOps/21-final-devops-project/.github/workflows/s21-final-devops-project.yml
#
#  backend-test ─┐                      ┌─ sast ─────────┐
#  frontend-test ┴─ docker-build+trivy ─┤  sca           ├─ security-gate ─ push-ghcr ─ deploy-kind ─ gitops-bump
#                                       │  secret-scan   │
#                                       └─ iac-scan ─────┘
name: s21-final-devops-project

on:
  push:
    branches: [main]
    paths:
      - "DevOps/21-final-devops-project/**"
      - "!DevOps/21-final-devops-project/gitops/**"        # CI writes here; never re-trigger on it
      - "!DevOps/21-final-devops-project/**/*.md"
      - "!DevOps/21-final-devops-project/screenshots/**"
      - "!DevOps/21-final-devops-project/evidence/**"
      - ".github/workflows/s21-final-devops-project.yml"
  pull_request:
    paths:
      - "DevOps/21-final-devops-project/**"
      - ".github/workflows/s21-final-devops-project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s21-final-${{ github.ref }}
  cancel-in-progress: false   # runs are serialised so GitOps bumps land in commit order

env:
  APP_DIR: DevOps/21-final-devops-project
  IMAGE_PREFIX: ghcr.io/astro-dude/s21-tickethub
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0

jobs:
  # ------------------------------------------------------------------ BUILD & TEST
  backend-test:
    name: Backend lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/application/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/application/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format check)
        run: ruff check . && ruff format --check .
      - name: Pytest (SQLite test DB, never production)
        run: pytest -v --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-report
          path: ${{ env.APP_DIR }}/application/backend/pytest-report.xml

  frontend-test:
    name: Frontend unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/application/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/application/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ${{ env.APP_DIR }}/application/frontend/dist

  # ------------------------------------------------------------------ DEVSECOPS
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bandit — Python security linter (fail on medium+)
        run: |
          pip install bandit==1.9.4
          bandit -r "$APP_DIR/application/backend/app" -ll -f txt
      - name: Semgrep — Python / JavaScript / React / Dockerfile rules
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/python --config p/javascript --config p/react --config p/dockerfile \
            --error --metrics=off "$APP_DIR/application" "$APP_DIR/docker"

  sca:
    name: SCA (pip-audit + npm audit + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip-audit (PyPI advisories for pinned requirements)
        run: |
          pip install pip-audit
          pip-audit -r "$APP_DIR/application/backend/requirements.txt" --strict
      - name: npm audit (fail on high+)
        working-directory: ${{ env.APP_DIR }}/application/frontend
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan of lockfiles (HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "/src/$APP_DIR/application"

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # history scan needs every commit
      - name: Gitleaks — working tree of this project
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir "/repo/$APP_DIR" \
            --config "/repo/$APP_DIR/security/gitleaks.toml" --redact --verbose --exit-code 1
      - name: Gitleaks — git history touching this project
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --log-opts="--all -- $APP_DIR" \
            --config "/repo/$APP_DIR/security/gitleaks.toml" --redact --verbose --exit-code 1

  iac-scan:
    name: IaC misconfiguration scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config — Dockerfiles, raw manifests, Helm chart, Terraform
        # troubleshooting/ is skipped on purpose (deliberately broken manifests);
        # the ingress-nginx file is a vendored upstream release manifest.
        run: |
          docker run --rm -v "$PWD:/src" -w "/src/$APP_DIR" "$TRIVY_IMAGE" config --quiet \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile security/trivyignore.yaml \
            --skip-dirs application --skip-dirs troubleshooting --skip-dirs evidence \
            --skip-files kubernetes/cluster/ingress-nginx-kind-v1.15.1.yaml .

  docker-build:
    name: Docker build + Trivy image scan (${{ matrix.component }})
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          docker build \
            -f "$APP_DIR/docker/${{ matrix.component }}.Dockerfile" \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE_PREFIX-${{ matrix.component }}:$GITHUB_SHA" \
            "$APP_DIR/application/${{ matrix.component }}"
          docker image ls "$IMAGE_PREFIX-${{ matrix.component }}"
      - name: Trivy image scan — gate on fixable HIGH/CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE_PREFIX-${{ matrix.component }}:$GITHUB_SHA"
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE" image \
            --quiet --format cyclonedx --output "/out/sbom-${{ matrix.component }}.cdx.json" \
            "$IMAGE_PREFIX-${{ matrix.component }}:$GITHUB_SHA"
      - name: Save image for the push job
        run: docker save "$IMAGE_PREFIX-${{ matrix.component }}:$GITHUB_SHA" | gzip > image-${{ matrix.component }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.component }}
          path: |
            image-${{ matrix.component }}.tar.gz
            sbom-${{ matrix.component }}.cdx.json
          retention-days: 3

  security-gate:
    name: Security gate
    if: always()
    needs: [backend-test, frontend-test, sast, sca, secret-scan, iac-scan, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Every quality and security check must have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "## Security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| check | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "Gate CLOSED - failed/skipped: $failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gate OPEN - image may be published" | tee -a "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ DELIVERY
  push-ghcr:
    name: Push images to GHCR
    needs: security-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
      - name: Login to ghcr.io with the workflow GITHUB_TOKEN
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push SHA-tagged images (never :latest)
        run: |
          for c in backend frontend; do
            gunzip -c "image-$c.tar.gz" | docker load
            docker push "$IMAGE_PREFIX-$c:$GITHUB_SHA"
            echo "- \`$IMAGE_PREFIX-$c:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy-kind:
    name: Deploy to ephemeral kind cluster + smoke test
    needs: push-ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: s21-ci
          config: ${{ env.APP_DIR }}/kubernetes/cluster/kind-ci.yaml
      - name: Install ingress-nginx
        run: |
          kubectl apply -f "$APP_DIR/kubernetes/cluster/ingress-nginx-kind-v1.15.1.yaml"
          kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=120s
      - name: Namespace, GHCR pull secret, DB secret (generated, never stored in git)
        run: |
          kubectl apply -f "$APP_DIR/kubernetes/namespace.yaml"
          kubectl -n tickethub create secret docker-registry ghcr-pull --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl -n tickethub create secret generic tickethub-db \
            --from-literal=DB_USER=tickethub --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
      - name: helm upgrade --install (images pulled from GHCR by SHA)
        run: |
          helm upgrade --install tickethub "$APP_DIR/helm/tickethub" -n tickethub \
            -f "$APP_DIR/helm/tickethub/values-dev.yaml" \
            --set image.backend.tag="$GITHUB_SHA" --set image.frontend.tag="$GITHUB_SHA" \
            --set database.existingSecret=tickethub-db \
            --set "imagePullSecrets[0].name=ghcr-pull" \
            --wait --timeout 5m
          kubectl -n tickethub get deploy,pods,svc,ingress,hpa,pvc -o wide
      - name: Smoke test through the Ingress
        run: |
          H="Host: tickethub.localtest.me"
          for i in $(seq 1 30); do curl -sf -H "$H" http://localhost/api/info && break; sleep 2; done
          echo
          curl -sf -H "$H" http://localhost/api/info | jq -e --arg v "${GITHUB_SHA::7}" '.version == $v'
          curl -sf -H "$H" -X POST http://localhost/api/tickets -H 'content-type: application/json' \
            -d '{"subject":"CI smoke test ticket","requester":"ci@github","priority":"LOW"}' | jq .
          curl -sf -H "$H" http://localhost/api/stats | jq -e '.total >= 1'
          curl -sf -H "$H" http://localhost/ | grep -q '<div id="root">'
          echo "UI and API reachable through ingress-nginx"
      - name: helm test
        run: helm test tickethub -n tickethub --logs
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n tickethub describe pods
          kubectl -n tickethub logs -l app.kubernetes.io/instance=tickethub --all-containers --tail=50
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  gitops-bump:
    name: GitOps — bump image tag in gitops/
    needs: deploy-kind
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Write the new tag into the environment values Argo CD tracks
        run: |
          f="$APP_DIR/gitops/environments/kind/values.yaml"
          TAG="$GITHUB_SHA" yq -i '.image.backend.tag = strenv(TAG) | .image.frontend.tag = strenv(TAG)' "$f"
          git diff --stat
      - name: Commit and push (rebase on concurrent pushes, [skip ci] + paths filter prevent loops)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/gitops/environments/kind/values.yaml"
          if git diff --cached --quiet; then echo "tag already current"; exit 0; fi
          git commit -m "s21 gitops: deploy tickethub ${GITHUB_SHA::7} to kind [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push rejected, retrying ($i)"; sleep $((i * 5))
          done
          exit 1
